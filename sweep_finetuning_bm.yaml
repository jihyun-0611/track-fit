runs:

# ── basic (random split, 22 classes) ─────────────────────────────────────────

  - name: bm_finetuning
    overrides:
      - data=bm_basic
      - model=protogcn22
      - ckpt_file=bm_freeze/best_top1_acc_epoch_25.pth
      - name=bm_finetuning
      - work_dir=work_dirs/bm_finetuning

  - name: bm_finetuning_flip_only
