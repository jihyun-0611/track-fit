model:
  backbone:
    type: ProtoGCN
    num_prototype: 100
    tcn_ms_cfg:
      - [3, 1]
      - [3, 2]
      - [3, 3]
      - [3, 4]
      - ["max", 3]
      - "1x1"
    graph_cfg:
      layout: coco_new
      mode: random
      num_filter: 8
      init_off: 0.04
      init_std: 0.02
  cls_head:
    type: Head
    joint_cfg: coco_new
    num_classes: 22
    in_channels: 384
    weight: 0.2
    dropout: 0.5
    label_smoothing: 0.1
  test_cfg:
    average_clips: prob
data:
  val:
    pipeline:
      - type: UniformSampleFrames
        clip_len: 100
        num_clips: 1
      - type: PoseDecode
      - type: GenSkeFeat
        dataset: coco_new
        feats: [jm]
      - type: FormatGCNInput
        num_person: 1
      - type: Collect
        keys: [keypoint, label]
        meta_keys: []
      - type: ToTensor
        keys: [keypoint]
