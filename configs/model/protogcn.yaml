backbone:
  type: ProtoGCN
  num_prototype: 100
  tcn_ms_cfg:
    - [3, 1]
    - [3, 2]
    - [3, 3]
    - [3, 4]
    - ["max", 3]
    - "1x1"
  graph_cfg:
    layout: coco_new
    mode: random
    num_filter: 8
    init_off: 0.04
    init_std: 0.02
cls_head:
  type: Head
  joint_cfg: coco_new
  num_classes: 22
  in_channels: 384
  weight: 0.2
  dropout: 0.5
  label_smoothing: 0.1
  
  prior_path: ${oc.env:WORK_DIR,}/protect_torso_c05/confusion_prior_val.pt
  prior_mode: hard_margin           
  prior_hard_topk: 3
  prior_hard_norm: row_max
  csc_prior_alpha: 0.0               
  ce_prior_alpha: 1.0                 
  ce_prior_warmup_epochs: 20


