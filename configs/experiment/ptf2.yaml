# @package _global_
name: ptf2

temporal_occlusion:
  min_frames: 20
  max_frames: 40
  num_segments: 1
  p: 0.4
random_joint_mask:
  chance: [0.03, 0.03, 0.03, 0.03, 0.03,
           0.0,  0.0,  0.03, 0.03, 0.03,
           0.03, 0.0,  0.0,  0.03, 0.03,
           0.03, 0.03, 0.0,  0.0,  0.0]
  p: 0.7
flip:
  flip_ratio: 0.5
  
data:
  train:
    pipeline:
      - type: UniformSampleFrames
        clip_len: 100
      - type: PoseDecode
      - type: Flip
        flip_ratio: ${flip.flip_ratio}
        left_kp:  [1, 3, 5, 7, 9, 11, 13, 15]
        right_kp: [2, 4, 6, 8, 10, 12, 14, 16]
      - type: TemporalOcclusion
        min_frames: ${temporal_occlusion.min_frames}
        max_frames: ${temporal_occlusion.max_frames}
        num_segments: ${temporal_occlusion.num_segments}
        p: ${temporal_occlusion.p}
      - type: RandomJointMask
        chance: ${random_joint_mask.chance}
        p: ${random_joint_mask.p}
      - type: GenSkeFeat
        dataset: coco_new
        feats: [j]
      - type: FormatGCNInput
        num_person: 1
      - type: Collect
        keys: [keypoint, label]
        meta_keys: []
      - type: ToTensor
        keys: [keypoint]