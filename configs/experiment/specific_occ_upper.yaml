# @package _global_
name: specific_occ_upper

data:
  train:
    pipeline:
      - type: UniformSampleFrames
        clip_len: 100
      - type: PoseDecode
      - type: SpecificJointMask
        joints: [5, 6, 7, 8, 9, 10]
        p: 0.1
      - type: GenSkeFeat
        dataset: coco_new
        feats: [j]
      - type: FormatGCNInput
        num_person: 1
      - type: Collect
        keys: [keypoint, label]
        meta_keys: []
      - type: ToTensor
        keys: [keypoint]