# @package _global_
name: temporal_occlusion_cscl05

data:
  train:
    pipeline:
      - type: UniformSampleFrames
        clip_len: 100
      - type: PoseDecode
      - type: Flip
        flip_ratio: 0.5
        left_kp: [1, 3, 5, 7, 9, 11, 13, 15]
        right_kp: [2, 4, 6, 8, 10, 12, 14, 16]
      - type: RandomJointMask
        chance: 0.15
        p: 0.5
      - type: TemporalOcclusion
        min_frames: 25
        max_frames: 100
        num_segments: 1
        p: 0.5
      - type: GenSkeFeat
        dataset: coco_new
        feats: [j]
      - type: FormatGCNInput
        num_person: 1
      - type: Collect
        keys: [keypoint, label]
        meta_keys: []
      - type: ToTensor
        keys: [keypoint]


model:
  cls_head:
    weight: 0.5
