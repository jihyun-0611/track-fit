# @package _global_
name: random_joint_mask

data:
  train:
    pipeline:
      - type: UniformSampleFrames
        clip_len: 100
      - type: PoseDecode
      - type: RandomJointMask
        chance: 0.25
        p: 0.48
      - type: GenSkeFeat
        dataset: coco_new
        feats: [j]
      - type: FormatGCNInput
        num_person: 1
      - type: Collect
        keys: [keypoint, label]
        meta_keys: []
      - type: ToTensor
        keys: [keypoint]

