# @package _global_
name: random_joint_mask/${now:%m-%d-%H}/${now:%M-%S}-${oc.env:WANDB_RUN_ID,manual}

random_joint_mask:
  chance: 0.25
  p: 0.5
  
data:
  train:
    pipeline:
      - type: UniformSampleFrames
        clip_len: 100
      - type: PoseDecode
      - type: RandomJointMask
        chance: ${random_joint_mask.chance}
        p: ${random_joint_mask.p}
      - type: GenSkeFeat
        dataset: coco_new
        feats: [j]
      - type: FormatGCNInput
        num_person: 1
      - type: Collect
        keys: [keypoint, label]
        meta_keys: []
      - type: ToTensor
        keys: [keypoint]

