# @package _global_
name: jm_flip_temporal_crop

# Hypothesis: Combining spatial (flip) + speed perturbation (temporal crop) gives
# complementary generalization — flip handles left-right symmetry, temporal crop
# handles exercise speed variation. Both are well-suited for velocity features.

data:
  train:
    pipeline:
      - type: UniformSampleFrames
        clip_len: 100
        p_interval: [0.5, 1.0]
      - type: PoseDecode
      - type: Flip
        flip_ratio: 0.5
        left_kp: [1, 3, 5, 7, 9, 11, 13, 15]
        right_kp: [2, 4, 6, 8, 10, 12, 14, 16]
      - type: GenSkeFeat
        dataset: coco_new
        feats: [jm]
      - type: FormatGCNInput
        num_person: 1
      - type: Collect
        keys: [keypoint, label]
        meta_keys: []
      - type: ToTensor
        keys: [keypoint]
