# @package _global_
name: jm_temporal_crop

# Hypothesis: jm/bm are velocity features (jm = diff(j)), so temporal speed variation
# directly changes feature magnitudes and teaches speed-invariant motion representation.
# p_interval=(0.5, 1.0) randomly uses 50-100% of frames before uniform sampling,
# equivalent to 0.5x~1.0x speed perturbation on the motion signal.
# Used as a key augmentation in CTR-GCN, PoseConv3D for motion streams.

data:
  train:
    pipeline:
      - type: UniformSampleFrames
        clip_len: 100
        p_interval: [0.5, 1.0]
      - type: PoseDecode
      - type: GenSkeFeat
        dataset: coco_new
        feats: [jm]
      - type: FormatGCNInput
        num_person: 1
      - type: Collect
        keys: [keypoint, label]
        meta_keys: []
      - type: ToTensor
        keys: [keypoint]
