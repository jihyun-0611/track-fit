# @package _global_
name: strong_aug

data:
  train:
    pipeline:
      - type: UniformSampleFrames
        clip_len: 100
      - type: PoseDecode
      - type: Flip
        flip_ratio: 0.5
        left_kp: [1, 3, 5, 7, 9, 11, 13, 15]
        right_kp: [2, 4, 6, 8, 10, 12, 14, 16]
      - type: RandomJointMask
        chance: 0.35
        p: 0.5
      - type: SpecificJointMask
        joints: [5, 6, 7, 8, 9, 10]
        p: 0.25
      - type: SpecificJointMask
        joints: [11, 12, 13, 14, 15, 16, 17, 18, 19]
        p: 0.25
      - type: TemporalOcclusion
        min_frames: 20
        max_frames: 50
        num_segments: 1
        p: 0.45
      - type: GenSkeFeat
        dataset: coco_new
        feats: [j]
      - type: FormatGCNInput
        num_person: 1
      - type: Collect
        keys: [keypoint, label]
        meta_keys: []
      - type: ToTensor
        keys: [keypoint]
