# @package _global_
name: gradual_aug

dataset:
  train:
    pipeline:
      - type: UniformSampleFrames
        clip_len: 100
      - type: PoseDecode
      - type: RandomJointMask
        chance: 0.1
        p: 0.3
        schedule:
          - epoch: 2
            chance: 0.2
            p: 0.5
          - epoch: 3
            chance: 0.3
            p: 0.7
      - type: SpecificJointMask
        joints: [0, 1, 2]
        p: 0.2
        schedule:
          - epoch: 2
            p: 0.4
          - epoch: 3
            p: 0.6
      - type: TemporalOcclusion
        min_frames: 10
        max_frames: 30
        p: 0.2
        schedule:
          - epoch: 2
            max_frames: 50
            p: 0.4
          - epoch: 3
            max_frames: 80
            p: 0.6
      - type: GenSkeFeat
