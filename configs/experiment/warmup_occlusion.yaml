# @package _global_
name: warmup_occlusion

data:
  dataset_file: split_by_conf.pkl
  label_map: ${data.data_dir}/split_by_conf_label_mapping.json
  train:
    pipeline:
      - type: UniformSampleFrames
        clip_len: 100
      - type: PoseDecode
      - type: Flip
        flip_ratio: 0.5
        left_kp: [1, 3, 5, 7, 9, 11, 13, 15]
        right_kp: [2, 4, 6, 8, 10, 12, 14, 16]
      - type: RandomJointMask
        chance: 0.15
        p: 0.4
      - type: SpecificJointMask
        joints: [5, 6, 7, 8, 9, 10]
        p: 0.1
      - type: SpecificJointMask
        joints: [11, 12, 13, 14, 15, 16, 17, 18, 19]
        p: 0.1
      - type: TemporalOcclusion
        min_frames: 15
        max_frames: 25
        num_segments: 1
        p: 0.35
      - type: GenSkeFeat
        dataset: coco_new
        feats: [j]
      - type: FormatGCNInput
        num_person: 1
      - type: Collect
        keys: [keypoint, label]
        meta_keys: []
      - type: ToTensor
        keys: [keypoint]

total_epochs: 40
