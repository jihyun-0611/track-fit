defaults:
  - model: protogcn
  - dataset: exercise
  - _self_
  - optional experiment: finetuning

name: exercise_finetune
work_dir: null

seed: null
deterministic: false
compile: false

validate: true
test_last: false
test_best: false
auto_resume: true
resume_from: null
load_from: ${oc.env:PRETRAINED,}

total_epochs: 80

optimizer: 
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.001
  nesterov: true

lr_config:
  min_lr: 0.0

evaluation:
  interval: 5
  metrics: [top_k_accuracy, mean_class_accuracy]
  topk: [1]

checkpoint_config: 
  interval: 5

log_config:
  interval: 10


