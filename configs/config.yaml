defaults:
  - model: protogcn
  - data: basic
  - _self_
  - optional experiment: temporal_occlusion

name: exercise
work_dir: null

seed: null
deterministic: false
compile: false

validate: true
test_last: false
test_best: true
auto_resume: true
resume_from: null
ckpt_dir: ${oc.env:WORK_DIR,}
ckpt_file: freeze/best_top1_acc_epoch_20.pth
load_from: ${ckpt_dir}/${ckpt_file}

total_epochs: 100

optimizer: 
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true

lr_config:
  min_lr: 0.0

early_stopping:
  patience: 20

evaluation:
  interval: 5
  metrics: [top_k_accuracy, mean_class_accuracy]
  topk: [1, 5]

checkpoint_config: 
  interval: 5

log_config:
  interval: 100

wandb:
  enabled: true
  project: track-fit
  name: null
