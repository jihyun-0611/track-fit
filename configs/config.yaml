defaults:
  - model: protogcn22
  - data: j
  - _self_
  - optional experiment: random_joint_mask
  # random_joint_mask, flip_only, temporal_occlusion

name: exercise
work_dir: null

seed: null
deterministic: false
compile: false

validate: true
test_last: false
test_best: false
test_splits: [internal_test, final_test]
auto_resume: false
resume_from: null
ckpt_dir: ${oc.env:WORK_DIR,}
ckpt_file: finegym_j/best_top1_acc_epoch_141.pth
load_from: ${ckpt_dir}/${ckpt_file}

total_epochs: 100

optimizer: 
  lr: 0.0005
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true

scheduler:
  type: cosine_annealing                  # cosine_annealing | cosine_warm_restarts
  min_lr: 0.000001
  # T_0: 10
  # T_mult: 10

early_stopping:
  patience: 20

evaluation:
  interval: 5
  metrics: [top_k_accuracy, mean_class_accuracy]
  topk: [1, 5]

checkpoint_config: 
  interval: 5

log_config:
  interval: 10

wandb:
  enabled: true
  project: track-fit-new-data

