runs:
# NOTE: Replace XX with actual best epoch number from jm_freeze runs after freeze completes.

# ── basic (random split, 22 classes) ─────────────────────────────────────────

  - name: jm_finetuning
    overrides:
      - data=jm_basic
      - model=protogcn22_p400
      - ckpt_file=jm_freeze/best_top1_acc_epoch_20.pth
      - name=jm_finetuning
      - work_dir=work_dirs/jm_finetuning

  - name: jm_finetuning_flip_only
