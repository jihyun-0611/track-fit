runs:
  # basic_bone (random split, 22 classes)

  - name: bone_interpolate_occlusions
    overrides:
      - experiment=bone_interpolate_occlusions
      - data=bone_basic
      - load_from=work_dirs/bone_freeze/best_top1_acc_epoch_20.pth
      - name=bone_interpolate_occlusions
      - work_dir=work_dirs/bone_interpolate_occlusions

  - name: bone_interp_temporal_occlusion
    overrides:
      - experiment=bone_interp_temporal_occlusion
      - data=bone_basic
      - load_from=work_dirs/bone_freeze/best_top1_acc_epoch_20.pth
      - name=bone_interp_temporal_occlusion
      - work_dir=work_dirs/bone_interp_temporal_occlusion

  # byconf_bone (confidence split, 22 classes)

  - name: bone_byconf_interpolate_occlusions
    overrides:
      - experiment=bone_interpolate_occlusions
      - data=bone_byconf
      - load_from=work_dirs/bone_freeze_byconf/best_top1_acc_epoch_20.pth
      - name=bone_byconf_interpolate_occlusions
      - work_dir=work_dirs/bone_byconf_interpolate_occlusions

  - name: bone_byconf_interp_temporal_occlusion
    overrides:
      - experiment=bone_interp_temporal_occlusion
      - data=bone_byconf
      - load_from=work_dirs/bone_freeze_byconf/best_top1_acc_epoch_20.pth
      - name=bone_byconf_interp_temporal_occlusion
      - work_dir=work_dirs/bone_byconf_interp_temporal_occlusion

  # exclude_bone (random split + 클래스 제거, 20 classes)

  - name: bone_exclude_interpolate_occlusions
    overrides:
      - experiment=bone_interpolate_occlusions
      - data=bone_exclude
      - model=protogcn20
      - load_from=work_dirs/bone_freeze_exclude/best_top1_acc_epoch_10.pth
      - name=bone_exclude_interpolate_occlusions
      - work_dir=work_dirs/bone_exclude_interpolate_occlusions

  - name: bone_exclude_interp_temporal_occlusion
    overrides:
      - experiment=bone_interp_temporal_occlusion
      - data=bone_exclude
      - model=protogcn20
      - load_from=work_dirs/bone_freeze_exclude/best_top1_acc_epoch_10.pth
      - name=bone_exclude_interp_temporal_occlusion
      - work_dir=work_dirs/bone_exclude_interp_temporal_occlusion

  # exclude_byconf_bone (confidence split + 클래스 제거, 20 classes)

  - name: bone_exclude_byconf_interpolate_occlusions
    overrides:
      - experiment=bone_interpolate_occlusions
      - data=bone_exclude_byconf
      - model=protogcn20
      - load_from=work_dirs/bone_freeze_exclude_byconf/best_top1_acc_epoch_25.pth
      - name=bone_exclude_byconf_interpolate_occlusions
      - work_dir=work_dirs/bone_exclude_byconf_interpolate_occlusions

  - name: bone_exclude_byconf_interp_temporal_occlusion
    overrides:
      - experiment=bone_interp_temporal_occlusion
      - data=bone_exclude_byconf
      - model=protogcn20
      - load_from=work_dirs/bone_freeze_exclude_byconf/best_top1_acc_epoch_25.pth
      - name=bone_exclude_byconf_interp_temporal_occlusion
      - work_dir=work_dirs/bone_exclude_byconf_interp_temporal_occlusion
